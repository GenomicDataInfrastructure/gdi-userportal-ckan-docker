name: Scan Latest Two Semantically Versioned Image with Trivy and ORT

on:
  schedule:
    - cron: "0 14 * * 1" # Works on every Monday at 14:00 UTC
  workflow_dispatch:

permissions: {}

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ghcr.io/genomicdatainfrastructure/gdi-userportal-ckan-docker

jobs:
  # The newest release of each of the two newest minor versions, e.g. 1.9.3 and 1.8.7
  select-releases:
    runs-on: ubuntu-latest
    permissions:
      packages: read
    outputs:
      tags: ${{ steps.latest_tags.outputs.tags }}
    steps:
      - name: List the image tags and pick the latest two minor versions
        id: latest_tags
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Every page of versions, only release tags (1.2.3), not the sha-... or branch tags
          TAGS=$(gh api --paginate "/orgs/genomicdatainfrastructure/packages/container/gdi-userportal-ckan-docker/versions" \
            --jq '.[].metadata.container.tags[]' | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -rV)

          # The newest tag of each minor version, newest minor first, two of them
          LATEST=$(echo "$TAGS" | awk -F. '!seen[$1"."$2]++' | head -n 2)
          if [[ -z "$LATEST" ]]; then
            echo "No release tags found"
            exit 1
          fi
          echo "Tags to scan: $LATEST"

          echo "tags=$(echo "$LATEST" | jq -R . | jq -sc .)" >> "$GITHUB_OUTPUT"

  scan-image:
    runs-on: ubuntu-latest
    needs: select-releases
    permissions:
      packages: read
    strategy:
      fail-fast: false # a finding in one image does not hide the other
      matrix:
        tag: ${{ fromJSON(needs.select-releases.outputs.tags) }}
    steps:
      - name: Log in to the Container registry
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Scan the image with Trivy
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ matrix.tag }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH

  ort:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: OSS Review Toolkit (ORT) Analysis
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          repository: ${{ github.repository }}
          persist-credentials: false

      - uses: oss-review-toolkit/ort-ci-github-action@086d928d24ef1653dc0777296b312fda5faaaf52 # v1
        with:
          allow-dynamic-versions: "true"
          fail-on: "issues"
          run: "cache-dependencies,cache-scan-results,labels,analyzer,evaluator,advisor,reporter,upload-results"
