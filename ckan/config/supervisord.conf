[supervisord]
; Log to PID 1's stdout, not to a file under /var/log: no volume backs that path, so the logs would be
; lost with the container. supervisord daemonizes (nodaemon=false) and points its own fd 1/2 at
; /dev/null, so /dev/stdout would not reach the container runtime. logfile_maxbytes=0 disables
; rotation, which a stream cannot do.
logfile=/proc/1/fd/1
logfile_maxbytes=0
loglevel=info
nodaemon=false
minfds=1024
minprocs=200

[program:ckan_gather_consumer]
; Retry loop: if a dependency (e.g. Redis) is down at startup the command exits before startsecs on
; every attempt and supervisor gives up (FATAL) for good. The loop keeps the process alive.
command=runuser -u ckan -- sh -c 'while true; do /usr/local/bin/ckan --config=/srv/app/ckan.ini harvester gather-consumer; sleep 5; done'
numprocs=1
; Stop the whole process group: supervisor only signals the sh loop, which would leave the consumer
; running (a second one after the next start).
stopasgroup=true
killasgroup=true
; See the [supervisord] comment above: PID 1's stdout, not a file under /var/log.
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/1
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startsecs=10

[program:ckan_fetch_consumer]
; See ckan_gather_consumer above for why this is wrapped in a retry loop.
command=runuser -u ckan -- sh -c 'while true; do /usr/local/bin/ckan --config=/srv/app/ckan.ini harvester fetch-consumer; sleep 5; done'
numprocs=1
stopasgroup=true
killasgroup=true
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/1
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startsecs=10

[program:cron]
command=/usr/sbin/cron -f
numprocs=1
stdout_logfile=/proc/1/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/proc/1/fd/1
stderr_logfile_maxbytes=0
autostart=true
autorestart=true
startsecs=10

[include]
files = /etc/supervisor/conf.d/*.conf
