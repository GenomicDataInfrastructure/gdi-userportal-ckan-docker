name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint scripts, Dockerfiles and compose file
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # SC1090: the entrypoint scripts are sourced from a directory that does not exist in the repo
      - name: ShellCheck
        run: shellcheck --severity=warning --exclude=SC1090 ckan/setup/*.sh ckan/docker-entrypoint.d/*.sh bin/*

      - name: Hadolint
        run: |
          for dockerfile in ckan/Dockerfile ckan/Dockerfile.dev postgresql/Dockerfile; do
            echo "== $dockerfile"
            docker run --rm -i hadolint/hadolint:v2.15.1 hadolint --failure-threshold error - < "$dockerfile"
          done

      # .env.example holds every variable with a safe value, so the file can be checked without secrets
      - name: Validate the compose file
        run: docker compose --env-file .env.example -f docker-compose.yml config --quiet

  image:
    name: Build ${{ matrix.dockerfile }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        dockerfile: [Dockerfile, Dockerfile.dev]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./ckan
          file: ./ckan/${{ matrix.dockerfile }}
          push: false
          load: true
          tags: ckan-ci:${{ matrix.dockerfile }}
          cache-from: type=gha,scope=${{ matrix.dockerfile }}
          cache-to: type=gha,scope=${{ matrix.dockerfile }},mode=max

      # The start scripts run the profile generator before CKAN starts. An image whose pinned
      # extensions do not contain it would stop at that step, so run it here.
      # Advisory for the prod image until its pinned extension tags (ckan/Dockerfile) include the
      # profile packs; remove continue-on-error then. The dev image mounts the extensions from src/,
      # so there is nothing to check in it.
      - name: Smoke test, the profile generator runs in the image
        if: matrix.dockerfile == 'Dockerfile'
        continue-on-error: true
        env:
          IMAGE: ckan-ci:${{ matrix.dockerfile }}
        run: |
          docker run --rm -e PYTHONUSERBASE=/srv/app/.local "$IMAGE" sh -c '
            python3 -m ckanext.gdi_userportal.profile_packs.generator --output-dir /tmp/generated &&
            test -s /tmp/generated/dataset.yaml'
